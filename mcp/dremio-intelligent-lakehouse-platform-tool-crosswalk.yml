source: mcp/dremio-intelligent-lakehouse-platform-mcp.yml + openapi/*.yml
note: >-
  Derived by binding the MCP tools Dremio's documentation names to the operations in this repo's
  OpenAPI set. Two caveats are load-bearing and are not papered over. First, the live MCP
  tools/list is OAuth-gated (HTTP 401), so the tool set is the partial list the docs print and
  no inputSchema could be read — every binding is by name and semantics, never by schema match.
  Second, the OpenAPI in this repo is API Evangelist's best-effort description of the Dremio
  self-managed v3 REST API (base https://{hostname}/api/v3), while the hosted MCP server sits in
  front of Dremio Cloud (base https://api.dremio.cloud/v0). The two surfaces overlap
  semantically but are different deployments, which is why no row is graded higher than medium.
