source: >-
  PyPI JSON API (pypi.org/pypi/<pkg>/json), the Dremio docs driver + CLI pages, and the
  dremio GitHub organisation
note: >-
  Dremio ships no npm, Maven Central, NuGet, Go, RubyGems, Packagist or crates.io package.
  Maven Central was queried for g:com.dremio, g:com.dremio.distribution and a:dremio-jdbc-driver
  and returned numFound 0 for all three — the JDBC/ODBC drivers are distributed as signed
  downloads from dremio.com, not through a package registry. Language access to Dremio is
  Python (CLI + Arrow Flight) and JDBC/ODBC.
