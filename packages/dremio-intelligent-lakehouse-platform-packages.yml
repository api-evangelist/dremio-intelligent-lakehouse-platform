- language: python
  registry: github
  name: dremio-mcp
  url: https://github.com/dremio/dremio-mcp
  install: git clone https://github.com/dremio/dremio-mcp.git && uv sync
  official: true
  version: null
  published: null
  note: >-
    The self-hosted Dremio MCP Server. First-party (dremio GitHub organisation) and the docs
    install it by git clone plus `uv sync`. Checked 2026-09-06: it is NOT published to PyPI
