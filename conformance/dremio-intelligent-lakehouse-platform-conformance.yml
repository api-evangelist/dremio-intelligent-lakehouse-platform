domain_standards:
- id: apache-iceberg-rest-catalog
  conforms: true
  market: data lakehouse / table format
  evidence: >-
    Dremio SERVES the Apache Iceberg REST Catalog specification as a first-class base URL —
    https://catalog.dremio.cloud/api/iceberg/v1/, documented as "Iceberg Catalog REST" alongside
    the Dremio API and Login base URLs, with /namespaces given as the worked example. Probed
    2026-09-06: GET https://catalog.dremio.cloud/api/iceberg/v1/config returns HTTP 401 (live,
    auth-gated) while a sibling non-Iceberg path on the same host returns 404, so the Iceberg
    route is really mounted. Dremio also CONSUMES the same specification as a client, connecting
    to any Iceberg-REST-compatible catalog (Apache Polaris, AWS Glue, S3 Tables, Confluent
    Tableflow, Microsoft OneLake, Project Nessie).
  source:
  - https://docs.dremio.com/dremio-cloud/api/
  - https://docs.dremio.com/dremio-cloud/bring-data/connect/catalogs/iceberg-rest-catalog
  spec: https://iceberg.apache.org/rest-catalog-spec/
  significance: >-
    This is the domain standard for the lakehouse market and it is the one that decides whether a
    buyer needs a bespoke connector. Dremio speaking Iceberg REST on both sides means an existing
    Iceberg client can point at Dremio's Open Catalog, and Dremio can read another vendor's
    catalog, without either side writing an adapter.
- id: scim-2.0
  conforms: true
  market: enterprise identity provisioning
  evidence: >-
    Dremio exposes SCIM 2.0 endpoints at http://{hostname}:9047/scim/v2 and
    https://{hostname}/scim/v2, documented with "Version: SCIM 2.0" and header authentication,
    for user and group provisioning from Okta, Microsoft Entra ID and other IdPs. Dremio Cloud's
    published rate-limit table independently confirms the surface is live in the managed service:
    it lists "SCIM reads per minute - user 180" and "SCIM writes per minute - user 300".
  source:
  - https://docs.dremio.com/current/security/authentication/identity-providers/scim
  - https://docs.dremio.com/dremio-cloud/help-support/limits
  spec: https://datatracker.ietf.org/doc/html/rfc7644
- id: arrow-flight-sql
  conforms: true
  market: analytical data transport
  evidence: >-
    Arrow Flight and Arrow Flight SQL are a documented first-class data path
    (grpc+tls://data.dremio.cloud:443), with Dremio distributing Arrow Flight SQL JDBC 19.0.0 and
    ODBC 0.9.7 drivers and a documented ADBC path.
  source: https://docs.dremio.com/dremio-cloud/developer/arrow-flight-sql
  spec: https://arrow.apache.org/docs/format/FlightSql.html
- id: apache-polaris
  conforms: true
  market: lakehouse catalog governance
  evidence: >-
    Dremio's Open Catalog is documented as built on Apache Polaris (incubating), with Iceberg
    REST compatibility and RBAC.
  source: https://docs.dremio.com/current/data-sources/open-catalog/
