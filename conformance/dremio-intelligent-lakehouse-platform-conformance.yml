not_applicable:
- id: asyncapi
  reason: >-
    Dremio publishes no webhook, event or streaming callback surface. The docs sitemap carries no
    webhook or event-subscription page; change data is consumed by querying Iceberg snapshots and
    system tables. Not a gap — this API has no event surface to describe, so it is out of the
    denominator.
- id: grpc-protobuf
  reason: >-
    No consumer-facing .proto is published. dremio/dremio-oss carries a `protocol` Maven module,
    but its protobuf definitions are the engine's internal coordinator/executor RPC, not an API
    contract offered to callers. The gRPC surface Dremio DOES offer consumers is Apache Arrow
    Flight SQL, whose .proto belongs to Apache Arrow rather than to Dremio — so nothing was saved
    to grpc/. Recording an internal protocol as a published contract would credit Dremio with an
    API it does not sell.
- id: wsdl-soap
  reason: >-
    No SOAP surface. Probed https://api.dremio.cloud/?wsdl and /v0?wsdl (404) and
    https://www.dremio.com/?wsdl (403 bot challenge, no WSDL); the docs carry no SOAP or
    enterprise-integration section.
