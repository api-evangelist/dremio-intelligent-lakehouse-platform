specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Dremio | Intelligent Lakehouse Platform
providerId: dremio-intelligent-lakehouse-platform
generated: '2026-09-06'
method: searched
source: https://docs.dremio.com/dremio-cloud/help-support/limits
created: '2026-05-04'
modified: '2026-09-06'
tags:
  - Data
  - Analytics
  - Lakehouse
  - Rate Limiting
  - Quotas
description: >-
  Published Dremio Cloud rate limits and resource quotas, read from Dremio's own Limits page on
  2026-09-06. This replaces the 2026-05-04 scaffold, whose header names and per-tier numbers were
  bulk-sweep defaults that Dremio never published.
scope_note: >-
  Dremio states that rate limits are enforced on a single IP address and apply across all
  organizations and projects — the throttle is per source IP, not per API key or per account.
  That is unusual and matters to an agent: several agents sharing an egress IP share one budget.
headers:
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
headers_note: >-
  Dremio documents no rate-limit response headers and no exhaustion status code. Checked
  2026-09-06 on the Limits page and the API Reference overview — the numbers are published as
  documentation only, with no runtime signal. Recorded null rather than assuming the common
  X-RateLimit-* set, which is what the previous scaffold did.
responseCodes:
  throttled: null
  quotaExceeded: null
limit_count: 9
limits:
  - name: API calls per minute
    scope: ip-address
    metric: requests_per_minute
    limit: 1200
    tier: Enterprise
  - name: Job results reads
    scope: ip-address
    endpoint: /job/{id}/results
    metric: requests_per_minute
    limit: 1000
    tier: Enterprise
  - name: Job cancel
    scope: ip-address
    endpoint: /job/{id}/cancel
    metric: requests_per_minute
    limit: 100
    tier: Enterprise
  - name: Job status
    scope: ip-address
    endpoint: /job/{id}
    metric: requests_per_minute
    limit: 100
    tier: Enterprise
  - name: Username/password login
    scope: ip-address
    endpoint: /login/userpass
    metric: requests_per_second
    limit: 45
    tier: Enterprise
  - name: Login rate per user
    scope: user
    metric: requests_per_second
    limit: 100
    tier: Enterprise
  - name: SCIM reads (user)
    scope: ip-address
    metric: requests_per_minute
    limit: 180
    tier: Enterprise
  - name: SCIM writes (user)
    scope: ip-address
    metric: requests_per_minute
    limit: 300
    tier: Enterprise
  - name: Access control list updates
    scope: ip-address
    metric: requests_per_minute
    limit: 60
    tier: Enterprise
quotas:
  organization:
    projects: 200
    users: 15000
    custom_roles: 5000
    nested_role_layers: 10
    enterprise_identity_providers: 1
    user_invitations_at_once: 10
    pending_user_invitations: 100
    daily_user_invitations: 100
  project:
    engines: 50
    sources: 100
    folder_nesting_depth: 8
    tables: unlimited
    views: unlimited
    scripts_per_user: 1000
    acl_updates_per_minute: 600
  datasets:
    metadata_refresh_data_lake: 15 minutes
    metadata_refresh_rdbms: 1 hour
    reflection_refresh_frequency: 1 hour
    wiki_character_limit: 100000
    json_files: 300000
    row_width: 16 MB
    file_upload_size: 500 MB
  reflections:
    maximum: 500
    autonomous: 100
  ai_agent:
    files_per_message: 10
    max_file_size: 500 MB
    file_availability: 10 minutes
    custom_instructions_length: 5000
    skills_per_user: 20
    skill_instructions_length: 25000
  arrow_flight_sql:
    max_returned_data_volume: 10GB
    pipeline_drain_timeout: 50 seconds
  catalog:
    entity_name_length: 500
