openapi: 3.1.0
info:
  title: Dremio Intelligent Lakehouse REST Authentication PAT API
  version: 3.0.0
  description: Best-effort OpenAPI for Dremio's v3 REST API covering the catalog, jobs, reflections, sources, scripts, personal access tokens, and roles. Auth uses a bearer access token (OAuth or Personal Access Token).
  contact:
    name: API Evangelist
    email: kin@apievangelist.com
    url: https://docs.dremio.com/
servers:
- url: https://{hostname}/api/v3
  description: A Dremio server (self-hosted; substitute your hostname)
  variables:
    hostname:
      default: dremio.example.com
security:
- bearerAuth: []
tags:
- name: PAT
paths:
  /users/{userId}/tokens:
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - PAT
      summary: List personal access tokens for a user
      operationId: listUserTokens
      responses:
        '200':
          description: Tokens
    post:
      tags:
      - PAT
      summary: Create a personal access token
      operationId: createUserToken
      responses:
        '201':
          description: Token created
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: OAuth access token or Personal Access Token
